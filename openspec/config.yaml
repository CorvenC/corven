schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: self-hosted, open source (AGPL-3.0) deployment platform, like Vercel/Railway on your own VPS.
  Product name: Corven (CLI and binary `corven`, repo config file `corven.toml`). Brand: docs/brand/BRAND.md.
  Users: solo developers and small teams with one VPS.
  Stack: Go modular monolith (chi + Huma, sqlc + pgx, goose, River, slog, Docker SDK via socket proxy),
  PostgreSQL and Caddy as separate containers, React + Vite + TypeScript panel embedded in the binary
  (Tailwind, shadcn/ui, TanStack Router/Query, Lingui en/es, uPlot), Starlight docs.
  Targets: Ubuntu/Debian, amd64/arm64, 2 GB RAM server, platform under 300 MB.
  Decisions with rationale: docs/adr/.
  Roadmap: docs/ROADMAP.md. Never in scope: Kubernetes, serverless, Windows servers, telemetry.

rules:
  tasks:
    - Each task should fit in one small merge request (about 400 changed lines max)
    - Keep the project usable at the end of every task group

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
